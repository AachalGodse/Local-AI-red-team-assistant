[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostops"
version = "1.0.0"
description = "A local, offline AI red-team copilot (authorized use only)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["pentesting", "red-team", "security", "offensive", "ai"]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Semantic memory (RAG). Optional: GhostOps runs fully without it; `recall`
# just reports it's missing. Install with:  pip install -e '.[rag]'
rag = ["chromadb>=0.5"]

[project.scripts]
ghostops = "ghostops.cli:app"

[project.urls]
Homepage = "https://github.com/AachalGodse/Local-AI-red-team-assistant"
Repository = "https://github.com/AachalGodse/Local-AI-red-team-assistant"
Issues = "https://github.com/AachalGodse/Local-AI-red-team-assistant/issues"

[tool.setuptools.packages.find]
include = ["ghostops*"]

# Ship the curated knowledge base inside the wheel. Both the plaintext
# (payloads.yaml) and AV-safe base64 (payloads.b64) forms are packaged.
[tool.setuptools.package-data]
"ghostops.knowledge" = ["*.yaml", "*.b64"]
