# GhostOps configuration. Copy to ~/.ghostops/config.yaml or ./config.yaml
# and edit. GhostOps loads (in order): ./config.yaml, ~/.ghostops/config.yaml,
# then these built-in defaults.

llm:
  # Router / reasoning model — does tool routing and next-step reasoning ONLY,
  # never payload generation. dolphin-mistral (7B) is the recommended default.
  # No GPU? Try "phi3:mini" (CPU-friendly). Swap freely; it's optional.
  model: dolphin-mistral
  # Embedding model for semantic memory (RAG). Pull with:
  #   ollama pull nomic-embed-text
  embed_model: nomic-embed-text
  host: http://localhost:11434
  temperature: 0.4
  # If Ollama or the model is unreachable, GhostOps runs in offline mode
  # (manual commands still work; only the AI reasoning is disabled).
  # Check what's active any time with:  ghostops model

engagements:
  # Where engagement databases are stored.
  dir: ./engagements

tools:
  # Per-tool defaults. Timeouts are in seconds.
  nmap:
    default_args: "-sV -T4"
    timeout: 600
  gobuster:
    # common.txt (~4.6k entries) is fast; swap for a dirbuster list for depth.
    wordlist: /usr/share/wordlists/dirb/common.txt
    timeout: 600
  searchsploit:
    timeout: 120

safety:
  # Require explicit y/N confirmation before executing any tool.
  confirm_before_run: true
  # Hard-block execution against targets outside the engagement scope.
  enforce_scope: true
